name: Build & Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: "Create a release from this build"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    name: Build Windows x86_64
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-registry-

      - name: Cache build artifacts
        uses: actions/cache@v4
        with:
          path: target
          key: ${{ runner.os }}-cargo-target-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-target-

      - name: Build (release)
        run: cargo build --release --locked

      - name: Package artifact
        shell: pwsh
        run: |
          $version = (Select-String -Path Cargo.toml -Pattern '^version\s*=\s*"([^"]+)"').Matches.Groups[1].Value
          $zip = "airwin-v${version}-windows-x86_64.zip"
          Compress-Archive -Path target/release/airwin.exe, README.md -DestinationPath $zip
          echo "ZIP_NAME=$zip" >> $env:GITHUB_ENV
          echo "APP_VERSION=$version" >> $env:GITHUB_ENV

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: airwin-windows-x86_64
          path: ${{ env.ZIP_NAME }}
          retention-days: 14

  release:
    name: Publish Release
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.release || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: airwin-windows-x86_64

      - name: Determine release tag
        id: meta
        shell: bash
        run: |
          ZIP=$(ls airwin-*-windows-x86_64.zip)
          VERSION=$(echo "$ZIP" | sed -E 's/airwin-v(.*)-windows-x86_64.zip/\1/')
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF_NAME}"
          else
            TAG="v${VERSION}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: AirWin ${{ steps.meta.outputs.tag }}
          body: |
            ## AirWin ${{ steps.meta.outputs.tag }} — Windows build

            Automated build produced by GitHub Actions.

            ### Download
            - **airwin-windows-x86_64.zip** — extract and run `airwin.exe`

            ### Requirements
            - Windows 10 or later (x86_64)
            - Run as administrator (required for the mDNS discovery service)

            ### Notes
            - AirDrop and AirPlay run locally over your network.
            - AWDL support is disabled in this build (the upstream OWDL backend is unavailable); AirDrop/AirPlay over Wi-Fi are fully functional.
          files: ${{ steps.meta.outputs.zip }}
          prerelease: true
          fail_on_unmatched_files: true
